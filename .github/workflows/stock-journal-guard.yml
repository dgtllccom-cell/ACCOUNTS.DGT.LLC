name: stock-journal-guard
on:
  pull_request:
  push:
    branches: [production, main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stock-journal-guard.mjs
