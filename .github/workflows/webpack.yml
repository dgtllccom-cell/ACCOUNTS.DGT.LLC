name: NodeJS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Next.js Application
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://csesvyxqjivnkkozgopt.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_22nhsWCggOvyEf-hYmAcfA_vFo7zk4w"
        SUPABASE_SERVICE_ROLE_KEY: "dummy_key_for_ci_build"
        DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/postgres"
        NODE_OPTIONS: "--max-old-space-size=4096"
        NEXT_TELEMETRY_DISABLED: 1
        CI: false
      run: npm run build
