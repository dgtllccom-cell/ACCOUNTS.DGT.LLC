<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Dock ERP</title>
<style>
  html,body{margin:0;height:100%;background:#0a1f45;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic","Noto Nastaliq Urdu",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  h1{font-size:20px;margin:0}
  p{margin:0;opacity:.85;font-size:15px;line-height:1.6;max-width:28rem}
  button{margin-top:8px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;padding:12px 28px}
</style>
</head>
<body>
<main>
  <h1>Digital Dock ERP</h1>
  <p id="msg">Cannot reach the ERP server. Check your internet connection and try again.</p>
  <button id="retry" type="button">Retry</button>
</main>
<script>
  // One shell page for all five ERP languages; the live ERP itself is loaded from the server (single ERP, single login).
  var T = {
    en: ["Cannot reach the ERP server. Check your internet connection and try again.", "Retry", "ltr"],
    ur: ["ERP سرور تک رسائی نہیں ہو سکی۔ اپنا انٹرنیٹ چیک کریں اور دوبارہ کوشش کریں۔", "دوبارہ کوشش کریں", "rtl"],
    ar: ["تعذّر الوصول إلى خادم النظام. تحقّق من اتصالك بالإنترنت وأعد المحاولة.", "إعادة المحاولة", "rtl"],
    fa: ["دسترسی به سرور سیستم ممکن نیست. اتصال اینترنت را بررسی کرده و دوباره تلاش کنید.", "تلاش دوباره", "rtl"],
    ps: ["د سیسټم سرور ته لاسرسی نشته. خپل انټرنیټ وګورئ او بیا هڅه وکړئ.", "بیا هڅه", "rtl"]
  };
  var l = ((navigator.language || "en").slice(0, 2)).toLowerCase();
  try { var s = localStorage.getItem("erp_lang"); if (s && T[s]) l = s; } catch (e) {}
  var t = T[l] || T.en;
  document.documentElement.lang = T[l] ? l : "en";
  document.documentElement.dir = t[2];
  document.getElementById("msg").textContent = t[0];
  document.getElementById("retry").textContent = t[1];
  document.getElementById("retry").onclick = function () { location.href = "https://api.dgt.llc/auth/login"; };
</script>
</body>
</html>
