name: Remaining Payment Journal Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/payment-journal-regression.yml'
      - 'features/journal/components/source-filtered-table.tsx'
      - 'features/journal/components/remaining-booking-table.tsx'
      - 'features/journal/components/purchase-order-payment-journal.tsx'
      - 'features/journal/components/purchase-payment-entry-document.tsx'
      - 'lib/journal/remaining-loading-entry.ts'
      - 'lib/journal/remaining-booking-table.ts'
      - 'lib/services/payment-due-tracking.ts'
      - 'tests/journal/remaining-booking-table.test.tsx'
      - 'tests/journal/remaining-loading-entry.test.ts'
  push:
    branches: [fix/remaining-payment-source-specific-journal-20261104]

permissions:
  contents: read

jobs:
  journal-unit:
    name: Remaining Journal UI and finance regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Test remaining journal bill source, dates, and loading rows
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- tests/journal/remaining-booking-table.test.tsx tests/journal/remaining-loading-entry.test.ts
