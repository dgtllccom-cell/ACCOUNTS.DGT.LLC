<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DGT.llc B / BS — design mockups</title>
<style>
:root{--brand:#0f3ea8;--primary:#2563eb;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--ok:#059669;--warn:#d97706;--bad:#dc2626;--teal:#2dd4bf;--bs:#0b4a6f}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:#e2e8f0;font-family:Inter,system-ui,"Noto Naskh Arabic",sans-serif;color:var(--text)}
h1{font-size:20px;margin:0 0 4px}p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-bottom:28px}
figure{margin:0}figcaption{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.phone{width:300px;height:620px;border-radius:34px;background:#111;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.screen{width:100%;height:100%;border-radius:26px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;font-size:12px}
.status{height:22px;background:var(--brand);color:#fff;font-size:10px;display:flex;justify-content:space-between;padding:4px 14px}
.bar{background:var(--brand);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.bar.bs{background:var(--bs)}
.body{padding:14px;flex:1;overflow:hidden}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#0f3ea8);color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;margin:26px 0 12px}
.logo.bs{background:linear-gradient(135deg,#0e7490,#0a2a4f)}
.input{height:44px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;margin:8px 0;padding:0 12px;display:flex;align-items:center;color:var(--muted);width:100%}
.btn{height:46px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px}
.btn.bs{background:var(--bs)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
.ok{background:#d1fae5;color:#065f46}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border-radius:14px;padding:10px;border-inline-start:4px solid var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:10px}
.card{background:var(--card);border-radius:14px;padding:10px;margin-top:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eef2f7}.li:last-child{border:0}
.tabbar{height:50px;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--muted)}
[dir=rtl]{font-family:"Noto Naskh Arabic","Noto Nastaliq Urdu",Tahoma,sans-serif}
.code{letter-spacing:.4em;font-size:22px;font-weight:800;margin:14px 0;direction:ltr}
</style>
</head>
<body>
<h1>DGT.llc B / DGT.llc BS — mockups</h1>
<p class="sub">Design reference only (tokens from docs/design-system.md). Shows structure — no real names, amounts or records.</p>

<div class="row">
  <figure><div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="body center">
      <div class="logo">DGT</div><b style="font-size:16px">Activate this device</b>
      <span style="color:var(--muted);margin:4px 0 14px">DGT.llc B · your administrator approves new phones</span>
      <div class="input">Device name (e.g. Ali's Samsung)</div>
      <div class="btn">Request approval</div>
      <span class="chip warn" style="margin-top:14px">Waiting for approval…</span>
    </div></div></div><figcaption>1 · Device activation — pending</figcaption></figure>

  <figure><div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="body center">
      <div class="logo">DGT</div><b style="font-size:16px">Enter activation code</b>
      <span style="color:var(--muted);margin:4px 0">Approved. Enter the 6-digit code from your administrator.</span>
      <div class="code">4 8 1 · 0 2 7</div>
      <div class="btn">Activate</div>
      <span style="color:var(--muted);margin-top:12px;font-size:11px">10 wrong codes lock this device</span>
    </div></div></div><figcaption>2 · Activation code</figcaption></figure>

  <figure><div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="body center">
      <div class="logo">DGT</div><b style="font-size:17px">DGT ACCOUNTS ERP</b>
      <span style="color:var(--muted);margin:2px 0 14px">Secure Enterprise Access</span>
      <div class="input">Email / User Code</div>
      <div class="input">Password</div>
      <div class="btn">Sign in securely →</div>
      <span style="margin-top:14px;color:var(--primary);font-weight:600">English ▾</span>
    </div></div></div><figcaption>3 · Login (no biometric stub in the apps)</figcaption></figure>
</div>

<div class="row">
  <figure><div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="bar">☰ <span style="flex:1">Dashboard</span> EN</div>
    <div class="body">
      <div class="kpis">
        <div class="kpi"><span>Open purchase bookings</span><b>—</b></div>
        <div class="kpi" style="border-color:var(--ok)"><span>Confirmed stock lots</span><b>—</b></div>
        <div class="kpi" style="border-color:var(--warn)"><span>Pending approvals</span><b>—</b></div>
        <div class="kpi" style="border-color:var(--bad)"><span>Overdue tasks</span><b>—</b></div>
      </div>
      <div class="card"><b>Get to the point</b>
        <div class="li"><span>Approvals waiting</span><span class="chip warn">Review</span></div>
        <div class="li"><span>Due today</span><span class="chip ok">On track</span></div>
        <div class="li"><span>Stock below minimum</span><span class="chip bad">Act</span></div></div>
    </div>
    <div class="tabbar"><span>Home</span><span>Purchase</span><span>Stock</span><span>Reports</span></div>
  </div></div><figcaption>4 · DGT.llc B home (counts come from live ERP data)</figcaption></figure>

  <figure><div class="phone"><div class="screen">
    <div class="status" style="background:var(--bs)"><span>9:41</span><span>●●●</span></div>
    <div class="bar bs">☰ <span style="flex:1">Shipping</span> EN</div>
    <div class="body">
      <div class="input" style="margin-top:0">🔍 Search shipment / container / B/L</div>
      <div class="kpis">
        <div class="kpi" style="border-color:var(--teal)"><span>In transit</span><b>—</b></div>
        <div class="kpi" style="border-color:var(--warn)"><span>At customs</span><b>—</b></div>
      </div>
      <div class="card"><b>Hand-over inbox</b>
        <div class="li"><span>Waiting for you</span><span class="chip warn">Open</span></div>
        <div class="li"><span>Returned</span><span class="chip bad">Fix</span></div></div>
    </div>
    <div class="tabbar"><span>Tracking</span><span>Inbox</span><span>Clearing</span><span>Reports</span></div>
  </div></div><figcaption>5 · DGT.llc BS home</figcaption></figure>

  <figure><div class="phone"><div class="screen" dir="rtl">
    <div class="status"><span>٩:٤١</span><span>●●●</span></div>
    <div class="bar">☰ <span style="flex:1">ډشبورډ</span> پښتو</div>
    <div class="body">
      <div class="kpis">
        <div class="kpi"><span>د پیرود پرانیستل شوي بکینګونه</span><b>—</b></div>
        <div class="kpi" style="border-color:var(--ok)"><span>تایید شوي سټاک</span><b>—</b></div>
      </div>
      <div class="card"><b>مهمې کارونه</b>
        <div class="li"><span>تصویبونه</span><span class="chip warn">وګورئ</span></div>
        <div class="li"><span>نن موعد</span><span class="chip ok">سمه</span></div></div>
    </div>
    <div class="tabbar"><span>کور</span><span>پیرود</span><span>سټاک</span><span>راپورونه</span></div>
  </div></div><figcaption>6 · RTL (Pashto) — whole screen mirrors; wording is a layout illustration, real text comes from <code>lib/i18n/ui.ts</code></figcaption></figure>
</div>
</body>
</html>
